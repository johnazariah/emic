experiment:
  # General settings
  random_seed: 42
  n_jobs: -1  # Use all cores

  # Verification (Shalizi 2000)
  verification:
    sequence_length: 100000
    processes:
      - name: "BiasedCoin"
        params: {p: 0.7}
      - name: "GoldenMean"
        params: {p: 0.5}
      - name: "EvenProcess"
        params: {p: 0.5}
      - name: "Periodic"
        params: {period: 3}

    # CSSR Parameters
    alphabet_size: 2
    history_length: 10
    alpha: 0.001

  # Application (Crutchfield 1994)
  application:
    # Reproducing "Complexity vs Entropy"
    logistic_map:
      r_start: 3.5
      r_end: 4.0
      steps: 100
      discard: 1000
      length: 10000
