# Convergence Experiment Configuration

experiment:
  id: EXP-001
  name: convergence
  version: 1.0.0
  description: State count and complexity convergence vs sample size

parameters:
  processes:
    - name: BiasedCoin
      module: emic.sources.synthetic.BiasedCoinSource
      params:
        p: 0.5
      true_states: 1
      true_cmu: 0.0

    - name: GoldenMean
      module: emic.sources.synthetic.GoldenMeanSource
      params:
        p: 0.5
      true_states: 2
      true_cmu: 0.9183

    - name: EvenProcess
      module: emic.sources.synthetic.EvenProcessSource
      params:
        p: 0.5
      true_states: 2
      true_cmu: 0.9183

    - name: Periodic5
      module: emic.sources.synthetic.PeriodicSource
      params:
        pattern: [0, 1, 0, 1, 0]
      true_states: 5
      true_cmu: 2.3219

  sample_sizes: [100, 500, 1000, 5000, 10000, 50000]
  repetitions: 50

  algorithm:
    name: CSSR
    config:
      max_history: 5
      significance: 0.001

outputs:
  - name: state_count
    file: results/state_count.parquet
    columns:
      - {name: process, type: string}
      - {name: n, type: int}
      - {name: rep, type: int}
      - {name: states, type: int}
      - {name: true_states, type: int}

  - name: complexity
    file: results/complexity.parquet
    columns:
      - {name: process, type: string}
      - {name: n, type: int}
      - {name: rep, type: int}
      - {name: cmu, type: float}
      - {name: hmu, type: float}
      - {name: true_cmu, type: float}

execution:
  parallel: true
  n_workers: 4
  seed_base: 42
