# Claims Registry: emic Framework Paper

# Each claim must have supporting evidence before inclusion in paper

claims:
  - id: C1
    section: 4.1
    text: >
      CSSR correctly infers the 2-state structure of the Golden Mean process
      with sample sizes n ≥ 5000 at 95% probability.
    evidence:
      experiment: convergence
      result_file: results/state_count.parquet
      query: |
        process == "GoldenMean" and n >= 5000
      condition: "mean(states == 2) >= 0.95"
    status: untested

  - id: C2
    section: 4.2
    text: >
      Computed statistical complexity matches analytical values within 1%
      relative error for all tested processes.
    evidence:
      experiment: paper_verification
      result_file: results/complexity.parquet
      condition: "abs(cmu - true_cmu) / true_cmu < 0.01"
    status: untested

  - id: C3
    section: 4.2
    text: >
      The excess entropy bound E ≤ Cμ holds for all tested processes.
    evidence:
      experiment: paper_verification
      result_file: results/excess_entropy.parquet
      condition: "E <= cmu + epsilon"
    status: untested

  - id: C4
    section: 5.2
    text: >
      CSSR maintains correct state count inference up to approximately
      10% bit-flip noise (ε ≈ 0.1).
    evidence:
      experiment: noise_robustness
      result_file: results/state_count.parquet
      query: |
        algorithm == "CSSR" and epsilon <= 0.1
      condition: "mean(states) < 2.5"
    status: untested

  - id: C5
    section: 3.2
    text: >
      The pipeline composition API reduces boilerplate by ~50% compared
      to manual chaining.
    evidence:
      type: code_comparison
      notes: Compare line counts of equivalent operations
    status: untested
