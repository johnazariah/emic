name: Draft JOSS Paper

on:
  push:
    paths:
      - '.project/research/computational-mechanics-review/joss/**'
      - '.github/workflows/draft-paper.yml'
  pull_request:
    paths:
      - '.project/research/computational-mechanics-review/joss/**'

jobs:
  paper:
    name: Build JOSS Paper PDF
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build draft PDF
        uses: openjournals/openjournals-draft-action@master
        with:
          journal: joss
          paper-path: .project/research/computational-mechanics-review/joss/paper.md

      - name: Upload paper PDF
        uses: actions/upload-artifact@v4
        with:
          name: joss-paper
          path: .project/research/computational-mechanics-review/joss/paper.pdf
