name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      use_testpypi:
        description: 'Publish to TestPyPI first'
        required: false
        default: false
        type: boolean
      include_joss_bundle:
        description: 'Include JOSS submission bundle artifact in this release'
        required: false
        default: true
        type: boolean

env:
  PYTHON_VERSION: "3.11"

jobs:
  # First, run the full CI suite
  ci:
    uses: ./.github/workflows/ci.yml

  build:
    name: Build Package
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Build package
        run: uv build

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  test-release:
    name: Test Built Package
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Install from wheel
        run: |
          uv venv test-env
          uv pip install --python test-env dist/*.whl

      - name: Test import
        run: |
          uv run --python test-env python -c "import emic; print(f'emic version: {emic.__version__}')"

  publish-testpypi:
    name: Publish to TestPyPI
    needs: test-release
    if: ${{ inputs.use_testpypi == true }}
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  publish-pypi:
    name: Publish to PyPI
    needs: test-release
    if: ${{ always() && needs.test-release.result == 'success' }}
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    name: Create GitHub Release
    needs: [publish-pypi, joss-submission]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download package artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Download JOSS submission bundle
        if: ${{ needs.joss-submission.result == 'success' }}
        uses: actions/download-artifact@v4
        with:
          name: joss-submission
          path: release-artifacts/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*
            release-artifacts/*.tar.gz
          fail_on_unmatched_files: false
          generate_release_notes: true
          draft: false

  publications:
    name: Publish PDF Papers
    needs: github-release
    uses: ./.github/workflows/publications.yml
    permissions:
      contents: write
    with:
      tag: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
      upload_to_release: true

  joss-submission:
    name: Package JOSS Submission
    needs: ci
    if: ${{ vars.JOSS_SUBMISSION_COMPLETE != 'true' && (github.event_name != 'workflow_dispatch' || inputs.include_joss_bundle == true) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepare JOSS bundle
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p release-artifacts/joss
          cp .project/research/computational-mechanics-review/paper-joss/paper.md release-artifacts/joss/paper.md
          cp .project/research/computational-mechanics-review/shared/bibliography/references.bib release-artifacts/joss/paper.bib
          tar -czf "release-artifacts/emic-joss-submission-${VERSION}.tar.gz" -C release-artifacts/joss paper.md paper.bib

      - name: Upload JOSS submission bundle
        uses: actions/upload-artifact@v4
        with:
          name: joss-submission
          path: release-artifacts/emic-joss-submission-*.tar.gz
