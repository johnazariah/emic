name: Publications

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to upload PDFs to (e.g., v0.5.1). Leave empty to skip release upload."
        required: false
        type: string
      upload_to_release:
        description: "Upload PDFs to the specified release tag"
        required: false
        default: true
        type: boolean

permissions:
  contents: write

jobs:
  build-pdfs:
    name: Build Publication PDFs
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version metadata
        id: meta
        run: |
          set -euo pipefail
          if [[ "${GITHUB_EVENT_NAME}" == "release" ]]; then
            TAG="${{ github.event.release.tag_name }}"
          elif [[ -n "${{ inputs.tag }}" ]]; then
            TAG="${{ inputs.tag }}"
          else
            TAG=""
          fi

          if [[ -n "$TAG" ]]; then
            VERSION="${TAG#v}"
          else
            VERSION="dev-${GITHUB_SHA::7}"
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Install LaTeX toolchain
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            latexmk \
            texlive-latex-extra \
            texlive-fonts-recommended \
            texlive-pictures \
            texlive-science \
            biber

      - name: Build publication PDFs
        run: |
          set -euo pipefail
          cd .project/research/computational-mechanics-review
          make review
          make techreport
          make tutorial

      - name: Stage versioned publication artifacts
        run: |
          set -euo pipefail
          VERSION="${{ steps.meta.outputs.version }}"
          BASE=".project/research/computational-mechanics-review"
          mkdir -p release-artifacts

          cp "$BASE/paper-technical/paper.pdf" "release-artifacts/emic-technical-report-${VERSION}.pdf"
          cp "$BASE/paper-tutorial/paper.pdf" "release-artifacts/emic-tutorial-${VERSION}.pdf"
          cp "$BASE/paper-review/paper.pdf" "release-artifacts/emic-review-paper-${VERSION}.pdf"

      - name: Upload publication artifacts
        uses: actions/upload-artifact@v4
        with:
          name: publications-pdf
          path: release-artifacts/*.pdf

      - name: Upload PDFs to release
        if: ${{ github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.upload_to_release == true && steps.meta.outputs.tag != '') }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          files: |
            release-artifacts/*.pdf
