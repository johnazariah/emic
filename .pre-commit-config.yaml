repos:
  - repo: local
    hooks:
      - id: ruff
        name: ruff
        entry: uv run ruff check --fix
        language: system
        types: [python]
      - id: ruff-format
        name: ruff-format
        entry: uv run ruff format
        language: system
        types: [python]

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
        args: ['--maxkb=1000']
      - id: check-merge-conflict
      - id: debug-statements

  - repo: local
    hooks:
      - id: pyright
        name: pyright
        entry: uv run pyright src
        language: system
        types: [python]
        pass_filenames: false

      - id: check-docstrings
        name: check docstrings
        entry: uv run python scripts/check_docstrings.py
        language: system
        types: [python]
        files: ^src/
        exclude: test_

      - id: check-testing-register
        name: check testing register
        entry: bash scripts/check_testing_register.sh
        language: system
        pass_filenames: true
        always_run: true

      - id: check-readme
        name: check readme
        entry: bash scripts/check_readme.sh
        language: system
        pass_filenames: true
        always_run: true
